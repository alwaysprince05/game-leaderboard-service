name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all tests (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify
      - name: Build Docker image
        run: docker build -t game-leaderboard-service:ci .
